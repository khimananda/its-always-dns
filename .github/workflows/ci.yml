name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Smoke test against a real host
        run: |
          go build -o its-always-dns ./cmd/its-always-dns
          rc=0; ./its-always-dns example.com --no-color || rc=$?
          test "$rc" -eq 53
          ./its-always-dns example.com --serious
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
